// une arête lumineuse entre deux points (un petit cylindre : un trait qui a de l'épaisseur)

function fenetres(g,w,h,d,x,y,z,cols,rangs,o){ o=o||{}; const fw=(o.fw||0.5)*w/cols, fh=(o.fh||0.45)*h/rangs;

 g=>{ socle(g,1.5); for(const [a,b] of [[V(-.9,.01,-.9),V(.9,.01,-.9)],[V(.9,.01,-.9),V(.9,.01,.9)],[V(.9,.01,.9),V(-.9,.01,.9)],[V(-.9,.01,.9),V(-.9,.01,-.9)]]) trait(g,a,b,NEON,0.03);

      bloc(g,3.3,.16,1.9,0,0,0,{c:OR,t:F}); bloc(g,3.0,1.7,1.4,0,.16,0,{t:0.02}); fenetres(g,3.0,1.7,1.4,0,.16,0,9,4,{fw:.42,fh:.55,g:1});
      bloc(g,3.1,.1,1.5,0,1.86,0,{c:OR,t:F});
      bloc(g,1.1,1.8,.3,0,.16,.75,{t:F,op:.5}); for(let i=0;i<4;i++) colonne(g,.045,1.55,-.45+i*.3,.16,.98,OR);

      pignon(g,1.2,.34,.34,0,1.96,.75,{c:OR,t:F});
