<!doctype html>
<!-- Page d'essai (28 nov. 2026) : trois propositions de logo « nuit néon » pour StreetKeep, à côté du logo actuel.
     Gautier : « il faut refaire le logo, là il ne ressemble pas du tout au jeu ». Hors publication (proto/). -->
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo StreetKeep : propositions</title>
<style>
@font-face{font-family:'Barlow Condensed';font-weight:700;src:url(../fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;src:url(../fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;src:url(../fonts/nunito-latin-800-normal.woff2) format('woff2')}
body{margin:0;background:#04081A;font-family:Nunito,sans-serif;color:#DCE9FF;display:flex;flex-wrap:wrap;gap:14px;padding:14px;justify-content:center}
.cas{width:330px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#1B2C6E 0,#0B1437 50%,#060B20 100%);box-shadow:0 0 0 1px rgba(90,168,255,.35);padding:14px 10px 12px;text-align:center}
.cas h2{margin:0 0 4px;font-size:17px;color:#FFD98A}.cas p{margin:0 0 6px;font-size:12px;opacity:.8;min-height:32px}
.cas svg.logo{width:100%;height:auto;display:block}
.bas{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px}
.bas svg{width:74px;height:74px;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.bas small{font-size:11px;opacity:.7;text-align:left}
</style></head><body>
<script src="geo.js"></script>
<script src="../src/logo.js"></script>
<script>
const F = "font-family=\"'Barlow Condensed','Arial Narrow',sans-serif\" font-weight=\"700\"";
const defs = (id) => `<defs>
  <filter id="${id}g" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="${id}p" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <linearGradient id="${id}or" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1B8"/><stop offset=".5" stop-color="#FFC93D"/><stop offset="1" stop-color="#E0900C"/></linearGradient>
  <linearGradient id="${id}nuit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16277A"/><stop offset="1" stop-color="#0A1238"/></linearGradient></defs>`;
// un tube de néon : un halo large, un halo serré, le trait de couleur, le cœur blanc
const neon = (id, d, c, w = 5) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w * 2.4}" stroke-linecap="round" stroke-linejoin="round" opacity=".55" filter="url(#${id}g)"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w * 1.3}" stroke-linecap="round" stroke-linejoin="round" opacity=".8" filter="url(#${id}p)"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="${w * 0.32}" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;
const texteNeon = (id, x, y, t, taille, c, esp = 3) => `<text x="${x}" y="${y}" text-anchor="middle" ${F} font-size="${taille}" letter-spacing="${esp}" fill="${c}" opacity=".7" filter="url(#${id}g)">${t}</text><text x="${x}" y="${y}" text-anchor="middle" ${F} font-size="${taille}" letter-spacing="${esp}" fill="${c}" opacity=".9" filter="url(#${id}p)">${t}</text><text x="${x}" y="${y}" text-anchor="middle" ${F} font-size="${taille}" letter-spacing="${esp}" fill="#fff">${t}</text>`;
const coins = (x0, y0, x1, y1, r) => `M${x0 + r} ${y0}H${x1 - r}A${r} ${r} 0 0 0 ${x1} ${y0 + r}V${y1 - r}A${r} ${r} 0 0 0 ${x1 - r} ${y1}H${x0 + r}A${r} ${r} 0 0 0 ${x0} ${y1 - r}V${y0 + r}A${r} ${r} 0 0 0 ${x0 + r} ${y0}Z`;
// une ligne de toits (maison, immeuble, tour…) entre x0 et x1, posée sur y
function toits(x0, y, pas, hs) { let d = `M${x0} ${y}`, x = x0; for (const h of hs) { if (h < 0) { d += `V${y + h * 0.55}L${x + pas / 2} ${y + h}L${x + pas} ${y + h * 0.55}V${y}`; } else d += `V${y - h}H${x + pas}V${y}`; x += pas; } return d; }

// A : la plaque de rue en néon (la forme des plaques de Paris, en tubes bleus ; le nom en blanc ; un filet d'or)
function logoA(id = 'a') { return `<svg class="logo" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">${defs(id)}
  <path d="${coins(40, 62, 560, 238, 22)}" fill="url(#${id}nuit)" opacity=".92"/>
  ${neon(id, coins(40, 62, 560, 238, 22), '#3F9BFF', 6)}
  ${neon(id, coins(58, 80, 542, 220, 14), '#FFC233', 2.2)}
  ${texteNeon(id, 300, 178, 'STREETKEEP', 96, '#5AA8FF', 4)}
  <circle cx="70" cy="150" r="5" fill="#FFD98A"/><circle cx="530" cy="150" r="5" fill="#FFD98A"/></svg>`; }
// B : la ligne de toits (la ville de nuit ; un bâtiment vert, le mien) au-dessus du nom en deux tons
function logoB(id = 'b') { const y = 148;
  return `<svg class="logo" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">${defs(id)}
  ${neon(id, toits(96, y, 34, [38, -52, 70, 44]), '#3F9BFF', 4)}
  ${neon(id, toits(232, y, 34, [96]), '#3DFFB0', 4.6)}
  ${neon(id, toits(266, y, 34, [58, -66, 84, 40, -48, 62, 34]), '#3F9BFF', 4)}
  ${neon(id, `M70 ${y}H530`, '#FFC233', 2.4)}
  <text x="300" y="236" text-anchor="middle" ${F} font-size="92" letter-spacing="4" fill="#5AA8FF" opacity=".7" filter="url(#${id}g)">STREETKEEP</text>
  <text x="300" y="236" text-anchor="middle" ${F} font-size="92" letter-spacing="4"><tspan fill="#fff">STREET</tspan><tspan fill="url(#${id}or)">KEEP</tspan></text></svg>`; }
// C : la carte à collectionner en néon, penchée, avec son bâtiment ; le nom sur une plaque pleine, bord d'or
function logoC(id = 'c') { return `<svg class="logo" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">${defs(id)}
  <g transform="translate(300 118) rotate(-9)"><rect x="-62" y="-92" width="124" height="172" rx="14" fill="url(#${id}nuit)"/>${neon(id, 'M-48 -92H48A14 14 0 0 1 62 -78V66A14 14 0 0 1 48 80H-48A14 14 0 0 1 -62 66V-78A14 14 0 0 1 -48 -92Z', '#FF5FD2', 4)}
    ${neon(id, 'M-30 52V-8L0 -40L30 -8V52M-10 52V22H10V52', '#3DFFB0', 3.4)}</g>
  <g transform="translate(300 118) rotate(11)" opacity=".55"><path d="M-48 -92H48A14 14 0 0 1 62 -78V66A14 14 0 0 1 48 80H-48A14 14 0 0 1 -62 66V-78A14 14 0 0 1 -48 -92Z" fill="none" stroke="#3F9BFF" stroke-width="3"/></g>
  <path d="${coins(60, 168, 540, 272, 16)}" fill="url(#${id}nuit)"/>${neon(id, coins(60, 168, 540, 272, 16), '#FFC233', 3.4)}
  ${texteNeon(id, 300, 246, 'STREETKEEP', 76, '#5AA8FF', 5)}</svg>`; }
// les icônes carrées assorties (le téléphone)
const icone = (id, corps) => `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">${defs(id)}<rect width="120" height="120" fill="#0A1238"/><circle cx="60" cy="54" r="70" fill="#1B2C6E" opacity=".55"/>${corps}</svg>`;
const iconeA = icone('ia', neon('ia', coins(16, 30, 104, 90, 9), '#3F9BFF', 4) + `<text x="60" y="76" text-anchor="middle" ${F} font-size="44" fill="#5AA8FF" filter="url(#iap)">SK</text><text x="60" y="76" text-anchor="middle" ${F} font-size="44" fill="#fff">SK</text>`);
const iconeB = icone('ib', neon('ib', toits(20, 84, 20, [26, -40]), '#3F9BFF', 3.4) + neon('ib', toits(60, 84, 20, [58]), '#3DFFB0', 3.8) + neon('ib', toits(80, 84, 20, [34]), '#3F9BFF', 3.4) + neon('ib', 'M14 84H106', '#FFC233', 2.2));
const iconeC = icone('ic', `<g transform="translate(60 60) rotate(-9) scale(.56)"><rect x="-62" y="-92" width="124" height="172" rx="14" fill="url(#icnuit)"/>${neon('ic', 'M-48 -92H48A14 14 0 0 1 62 -78V66A14 14 0 0 1 48 80H-48A14 14 0 0 1 -62 66V-78A14 14 0 0 1 -48 -92Z', '#FF5FD2', 6)}${neon('ic', 'M-30 52V-8L0 -40L30 -8V52M-10 52V22H10V52', '#3DFFB0', 5)}</g>`);
// --- les icônes pour le logo B (Gautier : « j'aime bien la B, mais je ne suis pas fan de l'icône ») : quatre essais, traits épais
const bati = (id, x, y, l, h, c, toit) => { const d = toit ? `M${x} ${y}V${y - h * 0.6}L${x + l / 2} ${y - h}L${x + l} ${y - h * 0.6}V${y}Z` : `M${x} ${y}V${y - h}H${x + l}V${y}Z`; return `<path d="${d}" fill="${c}" opacity=".22"/>` + neon(id, d, c, 3.6); };
const iconeB1 = icone('j1', bati('j1', 14, 92, 24, 34, '#3F9BFF', true) + bati('j1', 44, 92, 30, 68, '#3DFFB0') + bati('j1', 80, 92, 26, 46, '#3F9BFF') + neon('j1', 'M8 92H112', '#FFC233', 3));
const iconeB2 = icone('j2', `<text x="60" y="88" text-anchor="middle" ${F} font-size="66" letter-spacing="1" fill="#5AA8FF" opacity=".8" filter="url(#j2g)">SK</text><text x="60" y="88" text-anchor="middle" ${F} font-size="66" letter-spacing="1"><tspan fill="#fff">S</tspan><tspan fill="url(#j2or)">K</tspan></text>` + neon('j2', toits(24, 32, 12, [8, -14, 18, 10, -12, 14]), '#3F9BFF', 1.8) + neon('j2', 'M18 100H102', '#FFC233', 2.4));
const iconeB3 = icone('j3', neon('j3', 'M26 96V44L60 16L94 44V96Z', '#3DFFB0', 5) + neon('j3', 'M50 96V68H70V96', '#FFC233', 3.6) + `<rect x="36" y="48" width="12" height="12" rx="2" fill="#FFD98A"/><rect x="72" y="48" width="12" height="12" rx="2" fill="#FFD98A"/>`);
const iconeB4 = icone('j4', neon('j4', coins(12, 22, 108, 98, 10), '#3F9BFF', 3.6) + bati('j4', 26, 84, 16, 22, '#3F9BFF', true) + bati('j4', 48, 84, 22, 46, '#3DFFB0') + bati('j4', 76, 84, 18, 30, '#3F9BFF') + neon('j4', 'M22 84H98', '#FFC233', 2.4));
const essaiIcone = (nom, texte, ico) => `<div class="cas" style="width:190px"><h2>${nom}</h2><p>${texte}</p><div class="bas" style="flex-direction:column"><div style="zoom:1.6">${ico}</div><div style="zoom:.62;margin-top:6px">${ico}</div></div></div>`;
const ICONES_B = `<div class="cas" style="width:340px"><h2>Le logo B</h2><p>La ville de nuit, choisie par Gautier.</p>${logoB('bb')}</div><div style="flex-basis:100%"></div>`
  + essaiIcone('1 · Trois bâtiments', 'Pleins et épais : le tien au milieu.', iconeB1) + essaiIcone('2 · SK', 'Les initiales, blanc et or, sous les toits.', iconeB2)
  + essaiIcone('3 · La maison', 'Ta maison en néon vert, porte d’or.', iconeB3) + essaiIcone('4 · La plaque', 'La ville dans une plaque de rue.', iconeB4);
// --- RICHE (Gautier : « trop simpliste : les détails qu'il y a sont vraiment basiques ») : la ville travaillée
// un hasard fixe (les mêmes fenêtres allumées à chaque dessin)
const hasard = (g) => { let x = g; return () => { x = (x * 1103515245 + 12345) & 0x7fffffff; return x / 0x7fffffff; }; };
// un trait fin de néon (les détails : corniches, fenêtres, antennes)
const fin = (id, d, c, w = 1.3, o = 1) => '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + (w * 2.6) + '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (0.5 * o) + '" filter="url(#' + id + 'p)"/><path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round" opacity="' + o + '"/>';
// des fenêtres : une grille, certaines allumées (or chaud), les autres juste dessinées
function fenetres(id, x, y, l, h, col, rg, c, r, part = 0.45) { let out = ''; const fw = l / (col * 1.9), fh = h / (rg * 1.7), px = (l - col * fw) / (col + 1), py = (h - rg * fh) / (rg + 1);
  for (let i = 0; i < col; i++) for (let j = 0; j < rg; j++) { const fx = x + px + i * (fw + px), fy = y + py + j * (fh + py), on = r() < part;
    out += on ? '<rect x="' + fx + '" y="' + fy + '" width="' + fw + '" height="' + fh + '" rx="' + (fw * 0.18) + '" fill="#FFD98A" opacity=".9"/><rect x="' + (fx - 1) + '" y="' + (fy - 1) + '" width="' + (fw + 2) + '" height="' + (fh + 2) + '" fill="#FFC233" opacity=".5" filter="url(#' + id + 'p)"/>'
      : '<rect x="' + fx + '" y="' + fy + '" width="' + fw + '" height="' + fh + '" rx="' + (fw * 0.18) + '" fill="none" stroke="' + c + '" stroke-width=".8" opacity=".55"/>'; }
  return out; }
// un immeuble haussmannien : rez-de-chaussée à vitrine, étages, balcon filant, toit à la Mansart, lucarnes, cheminées
function haussmann(id, x, y, l, h, c, g, k = 1) { const r = hasard(g), t = h * 0.2, rdc = h * 0.17, top = y - h, w = 3 * k;
  let o = '<path d="M' + x + ' ' + y + 'V' + (top + t) + 'L' + (x + l * 0.08) + ' ' + top + 'H' + (x + l * 0.92) + 'L' + (x + l) + ' ' + (top + t) + 'V' + y + 'Z" fill="' + c + '" opacity=".16"/>';
  o += neon(id, 'M' + x + ' ' + y + 'V' + (top + t) + 'L' + (x + l * 0.08) + ' ' + top + 'H' + (x + l * 0.92) + 'L' + (x + l) + ' ' + (top + t) + 'V' + y, c, w);
  o += fin(id, 'M' + (x - 2 * k) + ' ' + (top + t) + 'H' + (x + l + 2 * k), c, 1.5 * k);                       // la corniche
  o += fin(id, 'M' + x + ' ' + (y - rdc) + 'H' + (x + l), c, 1.2 * k);                                           // le bandeau du rez-de-chaussée
  o += fin(id, 'M' + (x + l * 0.06) + ' ' + (top + t + (h - t - rdc) * 0.36) + 'H' + (x + l * 0.94), c, 0.9 * k, 0.8);   // le balcon filant
  const nl = Math.max(2, Math.round(l / (17 * k)));
  for (let i = 0; i < nl; i++) { const lx = x + l * 0.12 + (l * 0.76) * (i + 0.5) / nl, lw = Math.min(5 * k, l * 0.3 / nl + 2.4 * k); o += fin(id, 'M' + (lx - lw / 2) + ' ' + (top + t * 0.82) + 'V' + (top + t * 0.38) + 'Q' + lx + ' ' + (top + t * 0.12) + ' ' + (lx + lw / 2) + ' ' + (top + t * 0.38) + 'V' + (top + t * 0.82), c, 0.9 * k, 0.9); }   // les lucarnes
  o += fin(id, 'M' + (x + l * 0.2) + ' ' + top + 'V' + (top - 7 * k) + 'H' + (x + l * 0.3) + 'V' + top + 'M' + (x + l * 0.7) + ' ' + top + 'V' + (top - 5 * k) + 'H' + (x + l * 0.78) + 'V' + top, c, 1 * k, 0.9);   // les cheminées
  o += fenetres(id, x + l * 0.04, top + t + 2 * k, l * 0.92, h - t - rdc - 4 * k, nl, Math.max(2, Math.round((h - t - rdc) / (15 * k))), c, r, 0.5);
  o += fin(id, 'M' + (x + l * 0.1) + ' ' + y + 'V' + (y - rdc * 0.74) + 'H' + (x + l * 0.52) + 'V' + y + 'M' + (x + l * 0.64) + ' ' + y + 'V' + (y - rdc * 0.78) + 'Q' + (x + l * 0.75) + ' ' + (y - rdc * 1.02) + ' ' + (x + l * 0.86) + ' ' + (y - rdc * 0.78) + 'V' + y, c, 1 * k);   // la vitrine et la porte
  return o; }
// une tour de bureaux : façade en bandes, antenne
function tour(id, x, y, l, h, c, g, k = 1) { const r = hasard(g), top = y - h;
  let o = '<rect x="' + x + '" y="' + top + '" width="' + l + '" height="' + h + '" fill="' + c + '" opacity=".14"/>' + neon(id, 'M' + x + ' ' + y + 'V' + top + 'H' + (x + l) + 'V' + y, c, 2.6 * k);
  o += fin(id, 'M' + (x + l * 0.5) + ' ' + top + 'V' + (top - 16 * k) + 'M' + (x + l * 0.36) + ' ' + (top - 5 * k) + 'H' + (x + l * 0.64), c, 1 * k);
  o += '<circle cx="' + (x + l * 0.5) + '" cy="' + (top - 17 * k) + '" r="' + (1.8 * k) + '" fill="#FF5FD2"/><circle cx="' + (x + l * 0.5) + '" cy="' + (top - 17 * k) + '" r="' + (4 * k) + '" fill="#FF5FD2" opacity=".6" filter="url(#' + id + 'p)"/>';
  o += fenetres(id, x + 1, top + 3 * k, l - 2, h - 6 * k, Math.max(2, Math.round(l / (9 * k))), Math.max(3, Math.round(h / (10 * k))), c, r, 0.38);
  return o; }
// une maison : toit pentu, cheminée, fenêtre ronde, porte
function maison(id, x, y, l, h, c, k = 1) { const m = y - h * 0.58;
  let o = '<path d="M' + x + ' ' + y + 'V' + m + 'L' + (x + l / 2) + ' ' + (y - h) + 'L' + (x + l) + ' ' + m + 'V' + y + 'Z" fill="' + c + '" opacity=".16"/>' + neon(id, 'M' + x + ' ' + y + 'V' + m + 'L' + (x + l / 2) + ' ' + (y - h) + 'L' + (x + l) + ' ' + m + 'V' + y, c, 2.6 * k);
  o += fin(id, 'M' + (x - 3 * k) + ' ' + (m + 2 * k) + 'L' + (x + l / 2) + ' ' + (y - h - 2 * k) + 'L' + (x + l + 3 * k) + ' ' + (m + 2 * k), c, 1.2 * k);
  o += fin(id, 'M' + (x + l * 0.72) + ' ' + (y - h * 0.8) + 'V' + (y - h * 1.02) + 'H' + (x + l * 0.84) + 'V' + (y - h * 0.7), c, 1 * k);
  o += '<circle cx="' + (x + l / 2) + '" cy="' + (y - h * 0.68) + '" r="' + (l * 0.09) + '" fill="#FFD98A"/>' + '<rect x="' + (x + l * 0.14) + '" y="' + (y - h * 0.42) + '" width="' + (l * 0.24) + '" height="' + (h * 0.2) + '" rx="1" fill="#FFD98A" opacity=".9"/>';
  o += fin(id, 'M' + (x + l * 0.56) + ' ' + y + 'V' + (y - h * 0.34) + 'H' + (x + l * 0.82) + 'V' + y, c, 1 * k);
  return o; }
// une église : la nef, le clocher et sa flèche, la rosace
function eglise(id, x, y, l, h, c, k = 1) { const cl = l * 0.34, top = y - h;
  let o = '<path d="M' + x + ' ' + y + 'V' + (y - h * 0.34) + 'L' + (x + (l - cl) / 2) + ' ' + (y - h * 0.5) + 'L' + (x + l - cl) + ' ' + (y - h * 0.34) + 'V' + (y - h * 0.62) + 'L' + (x + l - cl / 2) + ' ' + top + 'L' + (x + l) + ' ' + (y - h * 0.62) + 'V' + y + 'Z" fill="' + c + '" opacity=".15"/>';
  o += neon(id, 'M' + x + ' ' + y + 'V' + (y - h * 0.34) + 'L' + (x + (l - cl) / 2) + ' ' + (y - h * 0.5) + 'L' + (x + l - cl) + ' ' + (y - h * 0.34) + 'M' + (x + l - cl) + ' ' + y + 'V' + (y - h * 0.62) + 'L' + (x + l - cl / 2) + ' ' + top + 'L' + (x + l) + ' ' + (y - h * 0.62) + 'V' + y, c, 2.4 * k);
  o += fin(id, 'M' + (x + l - cl / 2) + ' ' + top + 'V' + (top - 9 * k) + 'M' + (x + l - cl / 2 - 3 * k) + ' ' + (top - 5.5 * k) + 'H' + (x + l - cl / 2 + 3 * k), c, 1 * k);
  o += fin(id, 'M' + (x + l - cl) + ' ' + (y - h * 0.62) + 'H' + (x + l), c, 1 * k) + '<circle cx="' + (x + (l - cl) / 2) + '" cy="' + (y - h * 0.26) + '" r="' + (l * 0.07) + '" fill="#FFD98A"/>';
  o += fin(id, 'M' + (x + l - cl * 0.68) + ' ' + (y - h * 0.44) + 'V' + (y - h * 0.54) + 'Q' + (x + l - cl / 2) + ' ' + (y - h * 0.6) + ' ' + (x + l - cl * 0.32) + ' ' + (y - h * 0.54) + 'V' + (y - h * 0.44), c, 0.9 * k);
  o += fin(id, 'M' + (x + (l - cl) * 0.36) + ' ' + y + 'V' + (y - h * 0.13) + 'Q' + (x + (l - cl) / 2) + ' ' + (y - h * 0.2) + ' ' + (x + (l - cl) * 0.64) + ' ' + (y - h * 0.13) + 'V' + y, c, 0.9 * k);
  return o; }
// la ville au loin : une silhouette pleine, sombre
const loin = (x0, y, pas, hs, c = '#22399A', o = 0.6) => '<path d="' + toits(x0, y, pas, hs) + 'Z" fill="' + c + '" opacity="' + o + '"/>';
const etoiles = (g, n, x0, x1, y0, y1) => { const r = hasard(g); let o = ''; for (let i = 0; i < n; i++) { const t = r(); o += '<circle cx="' + (x0 + r() * (x1 - x0)) + '" cy="' + (y0 + r() * (y1 - y0)) + '" r="' + (0.5 + t * 1.1) + '" fill="#fff" opacity="' + (0.25 + t * 0.6) + '"/>'; } return o; };
// le nom en relief : une épaisseur sombre, le corps, un biseau clair, un liseré
