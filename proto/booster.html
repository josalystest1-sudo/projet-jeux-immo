<title>StreetKeep · prototype du booster</title>
<!--
  Prototype du booster néon (16 nov. 2026, interview de Gautier en 8 questions) : page d'essai, à part du jeu.
  Ses réponses : au centre, le nom du jeu en enseigne néon ; autour, un plan de ville en traits fins ; un sachet tout
  holographique ; à l'accueil il flotte, brille et suit l'inclinaison du téléphone ; le booster payé a un autre visuel,
  plus riche : un monument en néon doré derrière le nom ; quand on coupe le haut, un éclair de lumière, puis les cartes
  montent (de dos). Le sachet est un vrai volume 3D (Gautier, 6 nov. : pas de faux relief).
  Dans le jeu, ce dessin ira sur le sachet existant (dessinPochette, geoSachet) : ici tout est refait à part, en petit.
-->
<style>

<body>
<h1>Prototype du booster</h1>
<p class="sous" id="aide">Penche ton téléphone : le sachet change de couleur. Pose le doigt en haut du sachet et glisse en travers : la languette se décolle derrière lui.</p>
<div class="rangee" id="sortes"><button data-s="jour" class="on">Booster du jour</button><button data-s="paye">Booster payé</button></div>
<div class="scene" id="scene"><canvas id="vue" role="img" aria-label="Le booster en 3D"></canvas><div class="trace" id="trace"></div><div class="eclair" id="eclair"></div><div class="attente" id="attente">Préparation du booster…</div></div>
<div class="rangee"><button id="rejouer">Recommencer</button><button id="incliner" hidden>Activer l’inclinaison</button></div>
<p class="note">Après la sortie des cartes, chacune se révèle d’un toucher, comme sur <a href="cartes.html?v=197&amp;c=orne&amp;d=or&amp;dos">la page des cartes</a>.</p>

<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>

<script src="https://unpkg.com/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id), scene = $('scene'), cv = $('vue');
  const SORTES = { jour: { clair: '#DFF6FF', vif: '#38C8FF', fond: ['#0A1040', '#060A26'], eclair: '#7FE3FF' }, paye: { clair: '#FFF3D0', vif: '#FFB52E', fond: ['#1A1030', '#0A0616'], eclair: '#FFD27A' } };
  let sorte = 'jour';

  // ---------------------------------------------------------------- les dessins (canevas) posés sur le sachet
  const TW = 1024, TH = 1587;   // (le sachet : 2 de large pour 3,1 de haut)
  const COUPE = 0.115;          // (la soudure du haut, où l'on coupe : part de la hauteur)
  function toile() { const c = document.createElement('canvas'); c.width = TW; c.height = TH; return c; }
  function planDeVille(g, couleur) {
    let s = 11; const alea = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    g.save(); g.strokeStyle = couleur; g.lineWidth = 2.2;
    for (let y = -80; y < TH + 120; y += 150) for (let x = -120; x < TW + 120; x += 172) { const w = 118 + alea() * 34, h = 96 + alea() * 28, n = 1 + Math.floor(alea() * 3);
      g.save(); g.translate(x + (Math.round(y / 150) % 2) * 60, y); g.rotate(-0.21); g.strokeRect(0, 0, w, h); for (let k = 1; k <= n; k++) { g.beginPath(); g.moveTo(w * k / (n + 1), 0); g.lineTo(w * k / (n + 1), h); g.stroke(); } if (alea() > 0.5) { g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w * (1 / (n + 1)), h / 2); g.stroke(); } g.restore(); }
    g.restore();
  }
  // un tube de néon : un halo large, un tube coloré, un cœur blanc
  function neon(g, tracer, C, ep) {
    g.save(); g.lineJoin = 'round'; g.lineCap = 'round';
    g.shadowColor = C.vif; g.shadowBlur = ep * 5; g.strokeStyle = C.vif; g.lineWidth = ep * 1.9; g.globalAlpha = 0.55; tracer(); g.globalAlpha = 1;
    g.shadowBlur = ep * 2.2; g.lineWidth = ep; tracer();
    g.shadowBlur = 0; g.strokeStyle = C.clair; g.lineWidth = ep * 0.42; tracer(); g.restore();
  }
  function enseigne(g, C, y) {
    g.save(); g.font = '700 182px "Barlow Condensed", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    let esp = 0; try { g.letterSpacing = '10px'; esp = 5; } catch (e) { /* vieux navigateur */ }
    // des lettres pleines, très claires, avec un halo de la couleur du néon : lisibles d'abord (Gautier, 16 nov. : « la
    // couleur et l'effet de texte le rendent illisible »)
    g.lineJoin = 'round'; g.shadowColor = C.vif; g.shadowBlur = 34; g.strokeStyle = C.vif; g.lineWidth = 7; g.strokeText('STREETKEEP', TW / 2 + esp, y);
    g.shadowBlur = 12; g.fillStyle = '#FFFFFF'; g.fillText('STREETKEEP', TW / 2 + esp, y);
    g.restore();
    neon(g, () => { g.beginPath(); g.moveTo(150, y + 52); g.lineTo(TW / 2 - 46, y + 52); g.moveTo(TW / 2 + 46, y + 52); g.lineTo(TW - 150, y + 52); g.moveTo(TW / 2, y + 30); g.lineTo(TW / 2 + 22, y + 52); g.lineTo(TW / 2, y + 74); g.lineTo(TW / 2 - 22, y + 52); g.closePath(); g.stroke(); }, C, 5);
    neon(g, () => { g.beginPath(); g.moveTo(150, y - 172); g.lineTo(TW - 150, y - 172); g.stroke(); }, C, 5);
  }
  // la tour Eiffel au trait, pour le booster payé (le monument « qui dit qu'il y a du rare dedans »)
  const TOUR = { bas: 1040, haut: 258 };
  const demiTour = (t) => 285 * Math.pow(1 - t, 2.35) + 10 * (1 - t) + 4;
  function silhouetteTour(g, marge) { const cx = TW / 2, H = TOUR.bas - TOUR.haut; g.beginPath(); g.moveTo(cx - demiTour(0) - marge, TOUR.bas + marge);
    for (let t = 0; t <= 1.0001; t += 0.04) g.lineTo(cx - demiTour(t) - marge, TOUR.bas - t * H); g.lineTo(cx, TOUR.haut - 90 - marge); for (let t = 1; t >= -0.0001; t -= 0.04) g.lineTo(cx + demiTour(t) + marge, TOUR.bas - t * H); g.lineTo(cx + demiTour(0) + marge, TOUR.bas + marge); g.closePath(); }
  function tour(g, C) {
    const cx = TW / 2, bas = TOUR.bas, haut = TOUR.haut, H = bas - haut, Y = (t) => bas - t * H;
    const demi = demiTour;          // (demi-largeur extérieure à la hauteur t)
    const dedans = (t) => Math.max(0, demi(t) - (46 * (1 - t) + 10));              // (bord intérieur des piliers)
    neon(g, () => {
      g.beginPath();
      for (const s of [-1, 1]) { for (let t = 0; t <= 1.0001; t += 0.02) { const x = cx + s * demi(t); t ? g.lineTo(x, Y(t)) : g.moveTo(x, Y(t)); }
        for (let t = 0; t <= 0.3301; t += 0.02) { const x = cx + s * dedans(t); t ? g.lineTo(x, Y(t)) : g.moveTo(x, Y(t)); } }
      // la grande arche du pied, les trois plates-formes, le campanile et l'antenne
      g.moveTo(cx - dedans(0), Y(0)); g.quadraticCurveTo(cx, Y(0.2), cx + dedans(0), Y(0));
      for (const [t, d] of [[0.17, 14], [0.33, 10], [0.74, 6]]) { g.moveTo(cx - demi(t) - d, Y(t)); g.lineTo(cx + demi(t) + d, Y(t)); g.moveTo(cx - demi(t) - d, Y(t) - 14); g.lineTo(cx + demi(t) + d, Y(t) - 14); }
      g.moveTo(cx - 10, Y(0.955)); g.lineTo(cx + 10, Y(0.955)); g.moveTo(cx, Y(1)); g.lineTo(cx, Y(1.07));
      g.stroke();
    }, C, 9);
    neon(g, () => {   // le treillis, en traits fins
      g.beginPath();
      for (let k = 0; k < 13; k++) { const t0 = 0.34 + k * 0.047, t1 = t0 + 0.047; if (t1 > 0.95) break; g.moveTo(cx - demi(t0), Y(t0)); g.lineTo(cx + demi(t1), Y(t1)); g.moveTo(cx + demi(t0), Y(t0)); g.lineTo(cx - demi(t1), Y(t1)); }
      for (const s of [-1, 1]) for (let k = 0; k < 6; k++) { const t0 = k * 0.055, t1 = t0 + 0.055; g.moveTo(cx + s * demi(t0), Y(t0)); g.lineTo(cx + s * dedans(t1), Y(t1)); g.moveTo(cx + s * dedans(t0), Y(t0)); g.lineTo(cx + s * demi(t1), Y(t1)); }
      g.stroke();
    }, C, 4.2);
    // des étoiles autour du sommet
    g.save(); g.fillStyle = C.clair; g.shadowColor = C.vif; g.shadowBlur = 16; let s = 5; const alea = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let k = 0; k < 34; k++) { const x = 90 + alea() * (TW - 180), y = 215 + alea() * 600, r = 2 + alea() * 4; if (Math.abs(x - cx) < demi(1 - (y - haut) / H) + 40) continue; g.beginPath(); g.moveTo(x, y - r * 2); g.lineTo(x + r * 0.5, y - r * 0.5); g.lineTo(x + r * 2, y); g.lineTo(x + r * 0.5, y + r * 0.5); g.lineTo(x, y + r * 2); g.lineTo(x - r * 0.5, y + r * 0.5); g.lineTo(x - r * 2, y); g.lineTo(x - r * 0.5, y - r * 0.5); g.closePath(); g.fill(); }
    g.restore();
  }
  function soudures(g) {   // les bandes gaufrées du haut et du bas, et le trait de coupe
    for (const [y0, y1] of [[0, TH * COUPE], [TH * (1 - COUPE * 0.8), TH]]) { g.save(); g.fillStyle = 'rgba(8,12,40,.55)'; g.fillRect(0, y0, TW, y1 - y0);
      for (let x = 0; x < TW; x += 14) { g.fillStyle = x / 14 % 2 ? 'rgba(255,255,255,.16)' : 'rgba(0,0,0,.3)'; g.fillRect(x, y0, 7, y1 - y0); } g.restore(); }
    g.save(); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3; g.setLineDash([16, 12]); g.beginPath(); g.moveTo(0, TH * COUPE); g.lineTo(TW, TH * COUPE); g.stroke(); g.restore();
  }
  // le cartouche sombre derrière le nom (haut, bas, en points du dessin) : l'holographique s'y tait
  const CARTOUCHE = { jour: [628, 1064], paye: [1072, 1436] };
  function dessiner(recto) {
    const C = SORTES[sorte], base = toile(), lum = toile(), g = base.getContext('2d'), l = lum.getContext('2d');
    // le foil : un fond de nuit, l'arc-en-ciel de l'holographique en travers, de fines rayures
    const f = g.createLinearGradient(0, 0, 0, TH); f.addColorStop(0, C.fond[0]); f.addColorStop(1, C.fond[1]); g.fillStyle = f; g.fillRect(0, 0, TW, TH);
    const arc = g.createLinearGradient(0, 0, TW, TH); ['#ff2d8a', '#ffd400', '#22ffb0', '#22b8ff', '#a02dff', '#ff2d8a', '#ffd400', '#22ffb0', '#22b8ff'].forEach((c, i, a) => arc.addColorStop(i / (a.length - 1), c));
    g.globalAlpha = 0.24; g.fillStyle = arc; g.fillRect(0, 0, TW, TH); g.globalAlpha = 1;
    g.save(); g.globalAlpha = 0.1; g.strokeStyle = '#fff'; g.lineWidth = 2; for (let x = -TH; x < TW; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + TH * 0.55, TH); g.stroke(); } g.restore();
    const v = g.createRadialGradient(TW / 2, TH * 0.5, 60, TW / 2, TH * 0.5, TH * 0.62); v.addColorStop(0, 'rgba(4,6,24,.62)'); v.addColorStop(1, 'rgba(4,6,24,.1)'); g.fillStyle = v; g.fillRect(0, 0, TW, TH);
    planDeVille(g, sorte === 'paye' ? 'rgba(255,214,140,.34)' : 'rgba(150,200,255,.36)');
    // des ombres douces (pas de boîte) : la nuit se fait derrière le nom et le monument, pour que les néons se lisent, et
    // l'holographique s'y calme sans s'arrêter net (Gautier, 16 nov. : le cartouche « dénote avec le reste du décor »)
    const masque = toile(), k = masque.getContext('2d'); k.fillStyle = '#fff'; k.fillRect(0, 0, TW, TH);
    if (recto) { const [y0, y1] = CARTOUCHE[sorte];
      for (const [c, couleur, flou] of [[g, 'rgba(3,5,22,.82)', 70], [k, '#000', 90]]) { c.save(); c.fillStyle = couleur; c.shadowColor = couleur; c.shadowBlur = flou;
        c.beginPath(); c.ellipse(TW / 2, (y0 + y1) / 2, TW * 0.4, (y1 - y0) * 0.36, 0, 0, 6.283); c.fill(); c.fill();
        if (sorte === 'paye') { silhouetteTour(c, 26); c.fill(); c.fill(); } else { c.beginPath(); c.arc(TW / 2, 420, 86, 0, 6.283); c.fill(); }
        c.restore(); } }
    l.fillStyle = '#000'; l.fillRect(0, 0, TW, TH);
    if (recto) { if (sorte === 'paye') tour(l, C); enseigne(l, C, sorte === 'paye' ? 1282 : 862);
      // l'emblème à la maison, en haut
      neon(l, () => { const x = TW / 2, y = sorte === 'paye' ? 0 : 420; if (!y) return; l.beginPath(); l.arc(x, y, 74, 0, 6.283); l.moveTo(x - 44, y + 6); l.lineTo(x, y - 36); l.lineTo(x + 44, y + 6); l.moveTo(x - 30, y - 4); l.lineTo(x - 30, y + 38); l.lineTo(x + 30, y + 38); l.lineTo(x + 30, y - 4); l.moveTo(x - 9, y + 38); l.lineTo(x - 9, y + 14); l.lineTo(x + 9, y + 14); l.lineTo(x + 9, y + 38); l.stroke(); }, C, 6);
      l.save(); l.font = '800 50px Nunito, sans-serif'; l.textAlign = 'center'; l.fillStyle = '#FFFFFF'; l.shadowColor = C.vif; l.shadowBlur = 10; try { l.letterSpacing = '14px'; } catch (e) { /* rien */ }
      l.fillText(sorte === 'paye' ? 'BOOSTER OR' : 'BOOSTER DU JOUR', TW / 2 + 7, sorte === 'paye' ? 1408 : 1018); l.restore(); }
    else { l.save(); l.font = '700 96px "Barlow Condensed", sans-serif'; l.textAlign = 'center'; neon(l, () => l.strokeText('STREETKEEP', TW / 2, TH / 2), C, 5); l.restore(); }
    g.save(); g.globalCompositeOperation = 'lighter'; g.drawImage(lum, 0, 0); g.restore();
    soudures(g);
    return [base, lum, masque];
  }
  // le dos d'une carte, en petit (le vrai est sur la page des cartes)
  function dosCarte() { const c = document.createElement('canvas'); c.width = 480; c.height = 700; const g = c.getContext('2d'), C = SORTES.jour;
    const f = g.createRadialGradient(240, 330, 20, 240, 330, 430); f.addColorStop(0, '#16276E'); f.addColorStop(0.55, '#0A1238'); f.addColorStop(1, '#050818'); g.fillStyle = f; g.fillRect(0, 0, 480, 700);
    const rr = (i, a) => { g.beginPath(); g.moveTo(i + a, i); g.arcTo(480 - i, i, 480 - i, 700 - i, a); g.arcTo(480 - i, 700 - i, i, 700 - i, a); g.arcTo(i, 700 - i, i, i, a); g.arcTo(i, i, 480 - i, i, a); g.closePath(); g.stroke(); };
    neon(g, () => rr(8, 24), C, 5); g.strokeStyle = '#F2CE7A'; g.lineWidth = 2; rr(20, 16);
    neon(g, () => { g.beginPath(); g.arc(240, 336, 150, 0, 6.283); g.stroke(); }, { clair: '#FFF3D0', vif: '#F2CE7A' }, 3);
    neon(g, () => { g.beginPath(); g.moveTo(76, 262); g.lineTo(188, 262); g.arc(240, 262, 52, Math.PI, 0); g.lineTo(404, 262); g.lineTo(404, 426); g.lineTo(76, 426); g.closePath(); g.stroke(); }, C, 5);
    g.font = '700 58px "Barlow Condensed", sans-serif'; g.textAlign = 'center'; g.fillStyle = '#FFF1CC'; g.shadowColor = '#F2CE7A'; g.shadowBlur = 18; g.fillText('STREETKEEP', 240, 372); return c; }

  // ---------------------------------------------------------------- le sachet : un vrai volume
  const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, powerPreference: 'high-performance' }); ren.setClearColor(0x000000, 0);
  ren.outputEncoding = THREE.sRGBEncoding; ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.05;
  const monde = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 380 / 560, 0.1, 50); cam.position.set(0, 0.05, 7.9); monde.background = new THREE.Color(0x010207);
  monde.environment = new THREE.PMREMGenerator(ren).fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  const lampe = new THREE.PointLight(0xffffff, 1.2, 30); lampe.position.set(2, 3, 6); monde.add(lampe);
  const composer = new THREE.EffectComposer(ren); composer.addPass(new THREE.RenderPass(monde, cam));
  const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.4, 0.3, 0.9); composer.addPass(bloom);
  function taille() { const b = scene.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1), w = Math.max(2, Math.round(b.width)), h = Math.max(2, Math.round(b.height));
    ren.setPixelRatio(d); ren.setSize(w, h, false); composer.setPixelRatio(d); composer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  window.addEventListener('resize', taille);

  const L = 2, HT = 3.1, YC = HT / 2 - HT * COUPE;   // (YC : la hauteur de la ligne de coupe)
  // une face du sachet entre deux hauteurs (v de 0 en bas à 1 en haut) : bombée au milieu, plate aux soudures
  function face(v0, v1, signe) {
    const nx = 36, ny = Math.max(4, Math.round(64 * (v1 - v0))), pos = [], uv = [], idx = [];

    for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) { const u = i / nx, v = v0 + (v1 - v0) * j / ny, x = (u - 0.5) * L, y = (v - 0.5) * HT;
      const bord = Math.min(lisse(0, 0.16, v - COUPE * 0.8), lisse(0, 0.16, 1 - COUPE - v)), gonfle = Math.pow(Math.cos((u - 0.5) * Math.PI), 0.62) * bord;
      const pli = Math.sin(u * 23) * Math.sin(v * 17 + u * 5) * 0.012 * bord;   // (de légers plis : un sachet n'est jamais lisse)

    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { const a = j * (nx + 1) + i, b = a + 1, c = a + nx + 1, d = c + 1; if (signe > 0) idx.push(a, b, c, b, d, c); else idx.push(a, c, b, b, c, d); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals(); return g;
  }
  const sachet = new THREE.Group(), corps = new THREE.Group(), languette = new THREE.Group(), charniere = new THREE.Group(), cartes = new THREE.Group();
  monde.add(sachet); sachet.add(corps); sachet.add(charniere); charniere.position.set(L / 2, YC, 0); charniere.add(languette); languette.position.set(-L / 2, -YC, 0); sachet.add(cartes);
  let mats = [];
  const lueur = new THREE.Mesh(new THREE.PlaneGeometry(L * 0.94, 0.07), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true })); lueur.position.set(0, YC + 0.035, 0); lueur.visible = false; sachet.add(lueur);
  // la languette qui s'enroule : tout ce qui est derrière le doigt (dans le sens du geste) quitte le sachet en suivant un
  // arc de cercle, plus ou moins haut selon que le doigt monte ; devant le doigt, rien ne bouge encore
  function enrouler(p, sens, leve) {
    // la partie décollée se relève autour du point de coupe : une courbe douce (rayon R) jusqu'à un angle qui grandit quand
    // le doigt monte, puis toute droite ; chaque tranche de la languette tourne avec la courbe (elle ne se déforme pas)
    const R = 0.55, MAX = 0.4 + 0.42 * leve, front = sens > 0 ? -L / 2 + p * L : L / 2 - p * L;
    for (const m of languette.children) { const a = m.geometry.attributes.position, r = m.userData.repos;
      for (let i = 0; i < a.count; i++) { const x = r[i * 3], y = r[i * 3 + 1], z = r[i * 3 + 2], d = (x - front) * -sens;
        if (d <= 0 || p <= 0) { a.setXYZ(i, x, y, z); continue; }
        const ang = Math.min(d / R, MAX), reste = Math.max(0, d - R * MAX), h = y - YC, si = Math.sin(ang), co = Math.cos(ang);
        a.setXYZ(i, front - sens * (R * si + reste * co) + sens * h * si, YC + R * (1 - co) + reste * si + h * co, z + 0.22 * (1 - co) + reste * 0.12); }
      a.needsUpdate = true; m.geometry.computeVertexNormals(); }
  }
  function matiere(base, lum, calme) { const t = new THREE.CanvasTexture(base), e = new THREE.CanvasTexture(lum); t.encoding = THREE.sRGBEncoding; e.encoding = THREE.sRGBEncoding; t.anisotropy = e.anisotropy = 4;
    const m = new THREE.MeshPhysicalMaterial({ map: t, emissiveMap: e, emissive: 0xffffff, emissiveIntensity: 1.35, metalness: 0.55, roughness: 0.34, envMapIntensity: 0.75, clearcoat: 0.3, clearcoatRoughness: 0.3, transparent: true });
    // l'holographique : un arc-en-ciel qui dépend de l'angle sous lequel on regarde chaque point du sachet (donc de
    // l'inclinaison du téléphone et du bombé), strié comme un foil ; il s'ajoute à la lumière propre du sachet
    m.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      vec3 holoN = normalize( vNormal ); vec3 holoV = normalize( vViewPosition );
      float holoT = dot( holoN, holoV ) * 2.6 + vUv.x * 1.25 + vUv.y * 0.85;

      float holoB = pow( 0.5 + 0.5 * sin( 6.2831 * holoT * 0.85 ), 3.0 );                    // (de larges bandes vives, qui glissent)
      float holoS = mix( 0.1, 1.0, texture2D( uMasque, vUv ).r );                              // (plus calme derrière le nom et le monument)
      totalEmissiveRadiance += holoC * ( 0.075 + 0.2 * holoB ) * holoS;`).replace('void main() {', 'uniform sampler2D uMasque;\nvoid main() {'); sh.uniforms.uMasque = { value: calme }; };

  function construire() {
    for (const grp of [corps, languette, cartes]) while (grp.children.length) { const x = grp.children.pop(); x.geometry.dispose(); if (x.material.map) x.material.map.dispose(); if (x.material.emissiveMap) x.material.emissiveMap.dispose(); x.material.dispose(); }
    mats = []; const [b1, l1, m1] = dessiner(true), [b2, l2, m2] = dessiner(false), devant = matiere(b1, l1, new THREE.CanvasTexture(m1)), derriere = matiere(b2, l2, new THREE.CanvasTexture(m2)), vc = 1 - COUPE;
    corps.add(new THREE.Mesh(face(0, vc, 1), devant), new THREE.Mesh(face(0, vc, -1), derriere));
    languette.add(new THREE.Mesh(face(vc, 1, 1), devant), new THREE.Mesh(face(vc, 1, -1), derriere));
    for (const m of languette.children) m.userData.repos = m.geometry.attributes.position.array.slice();

    lueur.material.color.set(SORTES[sorte].eclair);
    const td = new THREE.CanvasTexture(dosCarte()); td.encoding = THREE.sRGBEncoding;
    for (let k = 0; k < 3; k++) { const c = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5 * 350 / 240), new THREE.MeshBasicMaterial({ map: td, transparent: true })); c.position.set(0, -0.25, -0.03 + k * 0.02); c.visible = false; cartes.add(c); }
    scene.style.setProperty('--e', SORTES[sorte].eclair); $('eclair').style.setProperty('--e', SORTES[sorte].eclair); bloom.strength = 0.4;
  }

  // ---------------------------------------------------------------- l'inclinaison
  let cible = { x: 0, y: 0 }, penche = { x: 0, y: 0 }, base = null, capteur = false;
  const borne = (v) => Math.max(-1, Math.min(1, v));
  function orientation(e) { if (e.gamma == null || e.beta == null) return; if (!capteur) { capteur = true; $('incliner').hidden = true; } if (!base) base = { g: e.gamma, b: e.beta };
    base.g += (e.gamma - base.g) * 0.004; base.b += (e.beta - base.b) * 0.004; cible.x = borne((e.gamma - base.g) / 22); cible.y = borne((e.beta - base.b) / 22); }
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') { $('incliner').hidden = !(window.matchMedia && matchMedia('(pointer:coarse)').matches);
    $('incliner').addEventListener('click', () => DeviceOrientationEvent.requestPermission().then((r) => { if (r === 'granted') $('incliner').hidden = true; }).catch(() => {})); }
  if (window.DeviceOrientationEvent) window.addEventListener('deviceorientation', orientation);

  // ---------------------------------------------------------------- couper le haut du sachet
  // etat : 'vitrine' (il flotte), 'coupe' (le doigt glisse), 'ouvert' (éclair, les cartes montent), 'fini'
  let etat = 'vitrine', coupe = 0, sens = 1, leve = 1, tOuvert = 0, doigt = null;
  function versEcran(x, y) { const v = new THREE.Vector3(x, y, 0.1).applyMatrix4(sachet.matrixWorld).project(cam), b = scene.getBoundingClientRect(); return [(v.x + 1) / 2 * b.width, (1 - v.y) / 2 * b.height]; }
  // où en est le doigt le long de la coupe (0 à gauche du sachet, 1 à droite), et de combien il est monté au-dessus
  function mesurer(e) { const b = scene.getBoundingClientRect(), [xg, yc] = versEcran(-L / 2, YC), [xd] = versEcran(L / 2, YC); return { u: (e.clientX - b.left - xg) / (xd - xg), haut: (yc - (e.clientY - b.top)) / (b.height * 0.12), yc, x: e.clientX - b.left, y: e.clientY - b.top }; }
  scene.addEventListener('pointerdown', (e) => { if (etat !== 'vitrine' && etat !== 'coupe') return; const m = mesurer(e); if (Math.abs(m.y - m.yc) > scene.getBoundingClientRect().height * 0.16) return;
    doigt = { u0: m.u, id: e.pointerId, parti: etat === 'coupe' }; try { scene.setPointerCapture(e.pointerId); } catch (err) { /* rien */ } });
  scene.addEventListener('pointermove', (e) => { const b = scene.getBoundingClientRect();
    if (doigt) { const m = mesurer(e);
      if (!doigt.parti && Math.abs(m.u - doigt.u0) > 0.04) { doigt.parti = true; sens = m.u > doigt.u0 ? 1 : -1; etat = 'coupe'; coupe = 0; lueur.visible = true; }
      if (doigt.parti) { const av = Math.max(0, Math.min(1, sens > 0 ? m.u : 1 - m.u)); coupe = Math.max(coupe, av);   // (la coupe ne recule jamais)
        leve = 0.75 + Math.max(0, Math.min(1.2, m.haut)) * 0.75; enrouler(coupe, sens, leve);
        const t = $('trace'), [xf, yf] = versEcran(sens > 0 ? -L / 2 + coupe * L : L / 2 - coupe * L, YC); t.style.opacity = 1; t.style.left = (xf - 11) + 'px'; t.style.top = (yf - 11) + 'px'; if (coupe >= 0.97) ouvrir(); } }
    else if (!capteur || e.pointerType === 'mouse') { cible.x = borne(((e.clientX - b.left) / b.width - 0.5) * 2); cible.y = borne(((e.clientY - b.top) / b.height - 0.5) * 2); } });
  const lacher = () => { doigt = null; $('trace').style.opacity = 0; if (etat === 'coupe' && coupe > 0.8) ouvrir(); };   // (on peut reprendre la coupe là où on l'a laissée)
  scene.addEventListener('pointerup', lacher); scene.addEventListener('pointercancel', lacher);
  scene.addEventListener('pointerleave', () => { if (!capteur) cible = { x: 0, y: 0 }; });
  function ouvrir() { if (etat === 'ouvert' || etat === 'fini') return; etat = 'ouvert'; tOuvert = performance.now(); doigt = null; $('trace').style.opacity = 0; enrouler(1, sens, leve); lueur.visible = true; const e = $('eclair'); e.classList.remove('on'); void e.offsetWidth; e.classList.add('on');
    if (navigator.vibrate) navigator.vibrate(30); $('aide').textContent = 'Un éclair, puis les cartes montent, de dos.'; }
  function remettre() { etat = 'vitrine'; coupe = 0; doigt = null; lueur.visible = false; if (languette.children.length) enrouler(0, 1, 1); charniere.rotation.set(0, 0, 0); charniere.position.set(L / 2, YC, 0); sachet.position.set(0, 0, 0); for (const m of mats) m.opacity = 1; for (const c of cartes.children) { c.visible = false; c.position.y = -0.25; c.rotation.z = 0; c.scale.setScalar(1); }
    $('eclair').classList.remove('on'); $('trace').style.opacity = 0; $('aide').textContent = 'Penche ton téléphone : le sachet change de couleur. Pose le doigt en haut du sachet et glisse en travers : la languette se décolle derrière lui.'; }
  $('rejouer').addEventListener('click', remettre);
  $('sortes').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; sorte = b.dataset.s; for (const x of document.querySelectorAll('#sortes button')) x.classList.toggle('on', x === b); construire(); remettre(); });

  // ---------------------------------------------------------------- la boucle
  const doux = (t) => t * t * (3 - 2 * t), entre = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
  const reduit = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
  function image(t) {

    penche.x += (cible.x - penche.x) * 0.1; penche.y += (cible.y - penche.y) * 0.1;

      cartes.children.forEach((c, k) => { const m = doux(entre(d, 0.35 + k * 0.22, 1.05 + k * 0.22)); c.visible = d > 0.3; c.position.y = -0.25 + m * 2.25; c.rotation.z = (k - 1) * 0.07 * m; });

    const P = new URLSearchParams(location.search); if (P.get('s') === 'paye') { sorte = 'paye'; for (const x of document.querySelectorAll('#sortes button')) x.classList.toggle('on', x.dataset.s === 'paye'); }
    construire(); $('attente').hidden = true; requestAnimationFrame(image); if (P.has('ouvrir')) setTimeout(ouvrir, 600); if (P.has('coupe')) { etat = 'coupe'; coupe = Number(P.get('coupe')) || 0.5; lueur.visible = true; enrouler(coupe, 1, 1.2); } });

})();
