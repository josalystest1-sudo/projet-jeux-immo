name: Serveur (Supabase)

# Met le vrai serveur à jour à chaque fusion qui le touche : les tables et fonctions SQL (supabase/sql),
# la fonction « jeu » (supabase/functions/jeu, avec les règles du jeu recopiées), puis un essai complet.
# Besoin : le secret GitHub SUPABASE_ACCESS_TOKEN (docs/serveur/GUIDE-SERVEUR.md). Sans lui, rien n'est envoyé.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/regles/**'
      - 'src/tirage.js'
      - 'geo.js'
      - 'data/celebres/**'
      - 'data/economie.json'
      - 'data/standing.json'
      - 'data/monuments.json'
      - 'tools/serveur_*.js'
      - '.github/workflows/serveur.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serveur
  cancel-in-progress: false

jobs:
  serveur:
    name: Mise à jour du serveur
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: hxtyecwofajiozmnfyxt
    steps:
      - uses: actions/checkout@v4
      - name: Le jeton Supabase est-il là ?
        id: jeton
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN absent : le serveur n'est pas mis à jour (docs/serveur/GUIDE-SERVEUR.md)."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests
        run: npm test
      - name: Tables et fonctions SQL
        if: steps.jeton.outputs.ok == '1'
        run: |
          for f in supabase/sql/*.sql; do
            echo "→ $f"
            jq -Rs '{query: .}' "$f" > /tmp/requete.json
            code=$(curl -s -o /tmp/reponse.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJET/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/requete.json)
            head -c 800 /tmp/reponse.json; echo
            if [ "$code" -ge 300 ]; then echo "::error::$f refusé par le serveur (HTTP $code)"; exit 1; fi
          done
      - name: Règles et données du jeu pour la fonction
        run: node tools/serveur_prepare.js
      - uses: supabase/setup-cli@v1
        if: steps.jeton.outputs.ok == '1'
        with:
          version: latest
      - name: Fonction « jeu »
        if: steps.jeton.outputs.ok == '1'
        run: supabase functions deploy jeu --use-api --no-verify-jwt --project-ref "$PROJET" --yes
      - name: Essai complet (un joueur jetable)
        if: steps.jeton.outputs.ok == '1'
        run: |
          sleep 10
          node tools/serveur_essai.js "$PROJET"
