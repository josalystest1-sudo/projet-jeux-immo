name: Publication sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Préparation du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          node --version && npm test
      - name: Site statique (tout le dépôt sauf l'outillage)
        run: |
          mkdir -p build
          rsync -a --exclude build --exclude .git --exclude .github --exclude node_modules --exclude tools --exclude tests ./ build/
      - name: Numéro de version (le jeu se met à jour tout seul quand il change)
        run: |
          V=$(echo "$GITHUB_SHA" | cut -c1-10)
          echo "{\"v\":\"$V\"}" > build/version.json
          sed -i "s/__VERSION__/$V/g; s/style\.css?v=[0-9a-z]*/style.css?v=$V/; s/compte\.js?v=[0-9a-z]*/compte.js?v=$V/" build/index.html
          grep -o "VERSION='[0-9a-z]*'" build/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
