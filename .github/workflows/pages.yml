name: Publication sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Préparation du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          if [ -f package.json ]; then npm ci --ignore-scripts && npm test; else echo "pas encore de tests"; fi
      - name: Site statique (tout le dépôt sauf l'outillage)
        run: |
          mkdir -p build
          rsync -a --exclude build --exclude .git --exclude .github --exclude node_modules --exclude tools --exclude tests ./ build/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
